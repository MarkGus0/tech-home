  - main [ref=f5e20]:
    - generic [ref=f5e23]:
      - heading "合作伙伴" [level=1] [ref=f5e24]
      - generic [ref=f5e25]:
        - paragraph [ref=f5e26]: 真正有价值的合作，不只是把名字放在同一张海报上
        - paragraph [ref=f5e27]: TechFlows 诞生于安徽合肥。与高校、企业、技术社区和空间合作，都从一件具体的事开始。
    - generic [ref=f5e30]:
      - heading "合作共建" [level=2] [ref=f5e31]
      - paragraph [ref=f5e32]: 我们希望每一次合作，都从一件具体的事情开始。
      - paragraph [ref=f5e33]: 可能是让一场值得参与的活动发生，让一个真实项目被更多人看见，也可能是让一群正在寻找方向的年轻人，遇见新的技术、伙伴和机会。
      - paragraph [ref=f5e34]: 合作可以是一场联合活动、一次项目征集、一项技术或场地支持，也可以是对方开放的赛事或实习线索、共创与展示机会。
      - paragraph [ref=f5e35]: 我们不追求只停留在品牌露出上的合作。比起出现在同一张海报上，我们更关心这次合作能否真正为参与者带来一些改变。
      - paragraph [ref=f5e36]: 对方提供当期线下场地，是最受欢迎的合作之一。必须有产物，必须有会后下一步。没有书面约定前，双方都不说已入驻。
      - paragraph [ref=f5e37]:
        - strong [ref=f5e38]:
          - text: 联系我们：
          - link "partner@techflows.app" [ref=f5e39] [cursor=pointer]:
            - /url: mailto:partner@techflows.app
