        - heading "For those who want to build something, find each other first" [level=1] [ref=f4e35]: For those who want to build something,find each other first
        - paragraph: Unfinished work can still be seen. Do not build a project alone.
        - generic [ref=f4e36]:
          - generic [ref=f4e37]:
            - paragraph: In an era of accelerating technological change, many young people are neither uninterested nor lacking in ideas.
            - paragraph: They just don't know where to start, who to reach out to, or — after finishing their first project — where to go next.
            - paragraph: TechFlows is an open community for young tech creators and early-stage projects. Born in Hefei, Anhui. Gatherings are in person; venue confirmed per event.
          - paragraph: Through gatherings, four questions, one small next step afterward, project records, and UNFINO, we help people in motion be seen. This community is unfinished too, so the next gathering happens because someone takes one piece.
        - generic:
